    color: #f7f0f8;

.forview {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;
}

.breathing-text {
    position: relative;
    display: inline-block;
    color: yellowgreen;

    font-size: clamp(40px, 8vw, 100px);

    animation: truckRide 5s ease-in-out infinite;

    text-shadow:
        0 0 4px rgba(246, 232, 95, 0.3);
}


@keyframes truckRide {

    /* ---------------- START ---------------- */

    0% {
        transform: translateY(0) rotate(0deg);

        text-shadow:
            0 0 4px rgba(246, 232, 95, 0.3);
    }


    /* accelerating */

    10% {
        transform: translateY(-1px) rotate(-0.15deg);

        text-shadow:
            3px 0 4px rgba(246, 232, 95, 0.18),
            6px 0 10px rgba(246, 232, 95, 0.12);
    }


    20% {
        transform: translateY(1px) rotate(0.2deg);

        text-shadow:
            6px 0 5px rgba(246, 232, 95, 0.25),
            12px 0 16px rgba(246, 232, 95, 0.15);
    }


    /* ---------------- FAST ---------------- */

    30% {
        transform: translateY(-1px) rotate(-0.2deg);

        text-shadow:
            10px 0 6px rgba(246, 232, 95, 0.3),
            20px 0 18px rgba(246, 232, 95, 0.2),
            35px 0 30px rgba(246, 232, 95, 0.1);
    }


    /* ---------------- ROAD BUMP ---------------- */

    35% {
        transform: translateY(-4px) rotate(-0.7deg);

        text-shadow:
            12px 0 7px rgba(246, 232, 95, 0.35),
            24px 0 20px rgba(246, 232, 95, 0.2);
    }


    37% {
        transform: translateY(3px) rotate(0.6deg);

        text-shadow:
            8px 0 6px rgba(246, 232, 95, 0.3),
            18px 0 18px rgba(246, 232, 95, 0.15);
    }


    /* ---------------- SMOOTH HIGH SPEED ---------------- */

    50% {
        transform: translateY(0) rotate(0deg);

        text-shadow:
            14px 0 8px rgba(246, 232, 95, 0.35),
            28px 0 22px rgba(246, 232, 95, 0.2),
            45px 0 35px rgba(246, 232, 95, 0.1);
    }


    /* ---------------- SECOND BUMP ---------------- */

    60% {
        transform: translateY(-3px) rotate(-0.5deg);

        text-shadow:
            18px 0 9px rgba(246, 232, 95, 0.4),
            35px 0 25px rgba(246, 232, 95, 0.2);
    }


    62% {
        transform: translateY(3px) rotate(0.5deg);

        text-shadow:
            12px 0 7px rgba(246, 232, 95, 0.3),
            25px 0 20px rgba(246, 232, 95, 0.15);
    }


    /* ---------------- CRUISING ---------------- */

    75% {
        transform: translateY(0) rotate(0deg);

        text-shadow:
            8px 0 6px rgba(246, 232, 95, 0.3),
            18px 0 18px rgba(246, 232, 95, 0.15);
    }


    /* ---------------- SLOWING ---------------- */

    88% {
        transform: translateY(-1px) rotate(-0.15deg);

        text-shadow:
            4px 0 5px rgba(246, 232, 95, 0.2),
            8px 0 12px rgba(246, 232, 95, 0.1);
    }


    /* ---------------- STOP ---------------- */

    100% {
        transform: translateY(0) rotate(0deg);

        text-shadow:
            0 0 4px rgba(246, 232, 95, 0.3);
    }
}









/* =========================
   ADD USER CARD
   ========================= */
.card {
    position: relative;
    overflow: hidden;

    background: #FFF7ED;
    color: black;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);

    isolation: isolate;
}


/* =========================
   DIAMOND EFFECT
   ========================= */
.diamond-effect {
    position: absolute;
    inset: 0;

    overflow: hidden;
    pointer-events: none;

    z-index: 1;
}
.card > h1,
.card > #message,
.card > form {
    position: relative;
    z-index: 2;
}.diamond {
    position: absolute;

    width: 40px;
    height: 40px;

    left: 50%;
    top: 50%;

    border: 3px solid #3f886360;

    transform:
        translate(-50%, -50%)
        rotate(45deg)
        scale(0);

    opacity: 0;
}


/* This class will be added by JavaScript */

.diamond.run {
    animation: diamondForward 3s linear infinite;
}


.diamond:nth-child(1) {
    animation-delay: 0s;
}

.diamond:nth-child(2) {
    animation-delay: 0.6s;
}

.diamond:nth-child(3) {
    animation-delay: 1.2s;
}

.diamond:nth-child(4) {
    animation-delay: 1.8s;
}

.diamond:nth-child(5) {
    animation-delay: 2.4s;
}

.diamond:nth-child(6) {
    animation-delay: 3.0s;
}

.diamond:nth-child(7) {
    animation-delay: 3.6s;
}

.diamond:nth-child(8) {
    animation-delay: 4.2s;
}

.diamond:nth-child(9) {
    animation-delay: 4.8s;
}

.diamond:nth-child(10) {
    animation-delay: 5.4s;
}

@keyframes diamondForward {

    0% {
        transform:
            translate(-50%, -50%)
            rotate(45deg)
            scale(0);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, -50%)
            rotate(45deg)
            scale(15);

        opacity: 0;
    }
}
/* Keep card content above diamonds */

.card-content {
    position: relative;
    z-index: 2;
}


.container {

.full {

label {

textarea,
button {

.buttons {

button {

button:disabled {

.reveal-left,

    opacity: 0;
    transition: opacity 0.8s ease, transform 0.8s ease;
}

.reveal-left {
    transform: translateX(-100px);
}

.reveal-right {
    transform: translateX(100px);
}


/* Added when the element enters the viewport */

.reveal-left.show,
.reveal-right.show {
    opacity: 1;
    transform: translateX(0);
}

table {

.history-popup {

    left: 0;

    height: 100%;

    background: rgba(0, 0, 0, 0.55);

    justify-content: center;

    padding: 20px;

}


/* White popup box */

    position: relative;

    width: 100%;

    max-width: 1200px;

    padding: 25px;

    overflow: auto;
}

    position: absolute;

    top: 10px;
    right: 10px;

    border: none;

    background: transparent;

    font-size: 22px;

    cursor: pointer;

    padding: 5px 10px;
}


/* History table */

.history-table {

    width: 100%;

    min-width: 1200px;

    border-collapse: collapse;

    margin-top: 20px;
}

.box {
    width: 80%;
    padding: 50px;
    background: lightblue;

    animation: slideIn linear both;
    animation-timeline: view();
    animation-range: entry 0% cover 40%;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-200px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

<script>

const submitButton = document.querySelector(".submit-btn");
const diamonds = document.querySelectorAll(".diamond");

submitButton.addEventListener("mouseenter", function () {

    diamonds.forEach(function(diamond) {
        diamond.classList.add("run");
    });

});


submitButton.addEventListener("mouseleave", function () {

    diamonds.forEach(function(diamond) {
        diamond.classList.remove("run");

        // Reset animation
        diamond.style.animation = "none";

        // Force browser to reset it
        diamond.offsetHeight;

        diamond.style.animation = "";
    });

});



/* ==================================================
   SCROLL REVEAL
   ================================================== */

const revealElements =
    document.querySelectorAll(
        ".reveal-left, .reveal-right"
    );


const observer =
    new IntersectionObserver(
        function(entries) {

            entries.forEach(function(entry) {

                if (entry.isIntersecting) {

                    entry.target.classList.add("show");

                }

            });

        },
        {
            threshold: 0.15
        }
    );


revealElements.forEach(function(element) {

    observer.observe(element);

});

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

let mouse = {
    x: null,
    y: null
};


/* ==================================================
   CANVAS
   ================================================== */

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    createParticles();

}

window.addEventListener("resize", resizeCanvas);


/* ==================================================
   MOUSE
   ================================================== */

window.addEventListener("mousemove", function(event) {

    mouse.x = event.clientX;
    mouse.y = event.clientY;

});

window.addEventListener("mouseleave", function() {

    mouse.x = null;
    mouse.y = null;

});


/* ==================================================
   PARTICLE
   ================================================== */

class Particle {

    constructor() {

        this.x =
            Math.random() * canvas.width;

        this.y =
            Math.random() * canvas.height;


        this.size =
            Math.random() * 2 + 1;


        /*
           Random roaming speed
        */

        this.speedX =
            (Math.random() - 0.5) * 0.5;

        this.speedY =
            (Math.random() - 0.5) * 0.5;

    }


    update() {

        /*
           Keep moving
        */

        this.x += this.speedX;
        this.y += this.speedY;


        /*
           Wrap around screen
        */

        if (this.x < 0)
            this.x = canvas.width;

        if (this.x > canvas.width)
            this.x = 0;

        if (this.y < 0)
            this.y = canvas.height;

        if (this.y > canvas.height)
            this.y = 0;


        /*
           Mouse reaction
        */

        if (mouse.x !== null) {

            const dx =
                this.x - mouse.x;

            const dy =
                this.y - mouse.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const radius = 150;


            if (
                distance < radius &&
                distance > 0
            ) {

                const force =
                    (radius - distance) /
                    radius;


                this.x +=
                    (dx / distance) *
                    force *
                    2;

                this.y +=
                    (dy / distance) *
                    force *
                    2;

            }

        }

    }


    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "rgb(238, 247, 118)";


        ctx.shadowBlur = 8;

        ctx.shadowColor =
            "#8B5CF6";

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}


/* ==================================================
   CREATE PARTICLES
   ================================================== */

function createParticles() {

    particles = [];


    const amount =
        Math.floor(
            (canvas.width * canvas.height) /
            2000
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push(
            new Particle()
        );

    }

}


/* ==================================================
   PURPLE CONNECTIONS
   ================================================== */

function connectParticles() {

    const maxDistance = 140;


    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < particles.length;
            j++
        ) {

            const dx =
                particles[i].x -
                particles[j].x;

            const dy =
                particles[i].y -
                particles[j].y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
               Connect only nearby particles
            */

            if (distance < maxDistance) {

                /*
                   Closer = brighter
                */

                const opacity =
                    (1 - distance / maxDistance) *
                    0.4;


                ctx.beginPath();

                ctx.moveTo(
                    particles[i].x,
                    particles[i].y
                );

                ctx.lineTo(
                    particles[j].x,
                    particles[j].y
                );


                ctx.strokeStyle =
                    `rgba(139, 92, 246, ${opacity})`;

                ctx.lineWidth = 0.7;

                ctx.stroke();

            }

        }

    }

}


/* ==================================================
   ANIMATION
   ================================================== */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Move particles
    */

    for (
        const particle of particles
    ) {

        particle.update();

    }


    /*
       Draw purple web
    */

    connectParticles();


    /*
       Draw particles
    */

    for (
        const particle of particles
    ) {

        particle.draw();

    }


    requestAnimationFrame(
        animate
    );

}

/* ==================================================
   API
   ================================================== */

const API_URL =
    "http://localhost/apiss/project1/user.php";


let currentPage = 1;

const limit = 5;

let totalPages = 1;

let editingId = null;



/* ==================================================
   MESSAGE
   ================================================== */

function showMessage(text, type) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display =
        "block";
}


function clearMessage() {

    const box =
        document.getElementById("message");

    box.style.display =
        "none";

    box.textContent =
        "";
}



/* ==================================================
   FORM DATA
   ================================================== */

function getFormData() {

    return {

        name:
            document.getElementById("name").value.trim(),

        dob:
            document.getElementById("dob").value,

        fathername:
            document.getElementById("fathername").value.trim(),

        qualification:
            document.getElementById("qualification").value.trim(),

        city:
            document.getElementById("city").value.trim(),

        mobileno:
            document.getElementById("mobileno").value.trim(),

        address:
            document.getElementById("address").value.trim()

    };

}



/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}



/* ==================================================
   READ JSON
   ================================================== */

async function readJson(response) {

    const text =
        await response.text();


    let data;


    try {

        data =
            text
                ? JSON.parse(text)
                : {};

    }

    catch (error) {

        throw new Error(
            "Server returned invalid JSON. HTTP "
            + response.status
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            ("Request failed. HTTP "
            + response.status)
        );

    }


    return data;
}



/* ==================================================
   GET USERS
   ================================================== */

async function getUsers() {

    clearMessage();


    try {

        const response =
            await fetch(
                API_URL
                + "?page="
                + currentPage
                + "&limit="
                + limit
            );


        const data =
            await readJson(response);


        displayUsers(
            data.users || []
        );


        totalPages =
            Math.max(
                1,
                Number(data.totalPages) || 1
            );


        document.getElementById(
            "pageInfo"
        ).textContent =
            "Page "
            + currentPage
            + " of "
            + totalPages;


        document.getElementById(
            "prevBtn"
        ).disabled =
            currentPage <= 1;


        document.getElementById(
            "nextBtn"
        ).disabled =
            currentPage >= totalPages;

    }


    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}



/* ==================================================
   DISPLAY USERS
   ================================================== */

function displayUsers(users) {

    const body =
        document.getElementById(
            "usersBody"
        );


    body.innerHTML =
        "";


    if (users.length === 0) {

        body.innerHTML =
            `
            <tr>
                <td colspan="10">
                    No users found.
                </td>
            </tr>
            `;

        return;

    }



    users.forEach(function(user) {


        const row =
            document.createElement("tr");


        const inactive =
            user.status === "inactive";


        if (inactive) {

            row.classList.add(
                "inactive-row"
            );

        }



        row.innerHTML = `

            <td>
                ${escapeHtml(user.id)}
            </td>


            <td>
                ${escapeHtml(user.name)}
            </td>


            <td>
                ${escapeHtml(user.dob)}
            </td>


            <td>
                ${escapeHtml(user.fathername)}
            </td>


            <td>
                ${escapeHtml(user.qualification)}
            </td>


            <td>
                ${escapeHtml(user.city)}
            </td>


            <td>
                ${escapeHtml(user.mobileno)}
            </td>


            <td>
                ${escapeHtml(user.address)}
            </td>


            <td class="${
                inactive
                ? "status-inactive"
                : "status-active"
            }">

                ${escapeHtml(user.status)}

            </td>


            <td class="action-column">


                <!-- UPDATE -->

                <button
                    type="button"
                    ${
                        inactive
                        ? "disabled"
                        : ""
                    }
                    onclick="updateUser(
                        ${Number(user.id)}
                    )"
                    title="Update" class="ed-bt"
                >

                    <i class="fa-solid fa-pen"></i>

                </button>



                <!-- VIEW -->

                <button
                    type="button"
                    ${
                        inactive
                        ? "disabled"
                        : ""
                    }
                    onclick="timelog(
                        ${Number(user.id)}
                    )"
                    title="View History"  class="v-bt"
                >

                    <i class="fa-solid fa-eye"></i>

                </button>



                <!-- STATUS TOGGLE -->

                <button
                    type="button"
                    onclick="toggleStatus(
                        ${Number(user.id)}
                    )"
                    title="Activate / Inactivate"  class="D-bt"
                >

                    <i class="fa-solid fa-trash"></i>

                </button>


            </td>

        `;


        body.appendChild(row);

    });

}



/* ==================================================
   VIEW HISTORY
   ================================================== */

async function timelog(id) {

    const popup =
        document.getElementById(
            "historyPopup"
        );


    const historyBody =
        document.getElementById(
            "historyBody"
        );


    historyBody.innerHTML =
        `
        <tr>
            <td colspan="11">
                Loading history...
            </td>
        </tr>
        `;


    popup.style.display =
        "flex";


    try {

        const response =
            await fetch(

                API_URL
                + "?id="
                + encodeURIComponent(id)
                + "&his=true"

            );


        const data =
            await readJson(response);


        const logs =
            data.history || [];


        historyBody.innerHTML =
            "";


        if (logs.length === 0) {
            const pd = document.getElementById("pd");
            pd.innerHTML=`user_ID: ${id}`;

            historyBody.innerHTML =
                `
                <tr>
                    <td colspan="11">
                        No history found.
                    </td>
                </tr>
                `;

            return;

        }


        else{
            const pd = document.getElementById("pd");
            pd.innerHTML=`user_ID: ${id}`;
        logs.forEach(
            function(log, index) {


                const row =
                    document.createElement("tr");


                let logClass =
                    "";


                if (
                    log.action === "CREATE"
                ) {

                    logClass =
                        "log-create";

                }


                else if (
                    log.action === "UPDATE"
                ) {

                    logClass =
                        "log-update";

                }


                else if (
                    log.action === "DELETE"
                ) {

                    logClass =
                        "log-delete";

                }



                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>


                    <td class="${logClass}">
                        ${escapeHtml(
                            log.action
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            log.times
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            log.name
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            log.dob
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            log.fathername
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            log.qualification
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            log.city
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            log.mobileno
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            log.address
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            log.status
                        )}
                    </td>

                `;


                historyBody.appendChild(
                    row
                );

            }
        );
        }

    }


    catch (error) {

        historyBody.innerHTML =
            `
            <tr>
                <td colspan="11">
                    ${escapeHtml(
                        error.message
                    )}
                </td>
            </tr>
            `;

    }

}

document.getElementById(

).addEventListener(

        document.getElementById(

document.getElementById(

/* ==================================================
   UPDATE USER
   ================================================== */

async function updateUser(id) {

    try {

        const response =
            await fetch(

                API_URL
                + "?id="
                + encodeURIComponent(id)

            );


        const user =
            await readJson(response);


        document.getElementById(
            "name"
        ).value =
            user.name || "";


        document.getElementById(
            "dob"
        ).value =
            user.dob || "";


        document.getElementById(
            "fathername"
        ).value =
            user.fathername || "";


        document.getElementById(
            "qualification"
        ).value =
            user.qualification || "";


        document.getElementById(
            "city"
        ).value =
            user.city || "";


        document.getElementById(
            "mobileno"
        ).value =
            user.mobileno || "";


        document.getElementById(
            "address"
        ).value =
            user.address || "";


        editingId =
            Number(id);


        document.getElementById(
            "formTitle"
        ).textContent =
            "Update User #" + id;


        document.getElementById(
            "submitBtn"
        ).textContent =
            "Update";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}



/* ==================================================
   TOGGLE STATUS
   ================================================== */

async function toggleStatus(id) {

    const confirmed =
        confirm(
            "Change this user's active/inactive status?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL
                + "?id="
                + encodeURIComponent(id),

                {
                    method: "DELETE"
                }

            );


        const data =
            await readJson(response);


        showMessage(
            "Status changed to "
            + data.status
            + ".",
            "success"
        );


        getUsers();

    }


    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}



/* ==================================================
   FORM SUBMIT
   ================================================== */

document.getElementById(
    "userForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearMessage();


        const data =
            getFormData();


        try {

            let response;


            if (
                editingId === null
            ) {

                response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(data)
                        }
                    );

            }


            else {

                response =
                    await fetch(

                        API_URL
                        + "?id="
                        + encodeURIComponent(
                            editingId
                        ),

                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(data)
                        }

                    );

            }


            const result =
                await readJson(
                    response
                );


            showMessage(

                editingId === null
                ? "User created successfully."
                : "User updated successfully.",

                "success"

            );


            clearForm();

            getUsers();

        }


        catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }
);



/* ==================================================
   CLEAR FORM
   ================================================== */

function clearForm() {

    document.getElementById(
        "userForm"
    ).reset();


    editingId =
        null;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add User";


    document.getElementById(
        "submitBtn"
    ).textContent =
        "Submit";

}



/* ==================================================
   PAGINATION
   ================================================== */

function previousPage() {

    if (
        currentPage > 1
    ) {

        currentPage--;

        getUsers();

    }

}



function nextPage() {

    if (
        currentPage < totalPages
    ) {

        currentPage++;

        getUsers();

    }

}



/* ==================================================
   INITIAL LOAD
   ================================================== */

getUsers();
