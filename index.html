
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Management</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: black;
    color: #f7f0f8;
}

.container {
    max-width: 1100px;
    margin: auto;
    position: relative;
    z-index: 1;
}

h1,
h2 {
    margin-top: 0;
}


/* =========================
   TOP TITLE
========================= */

.forview {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

.breathing-text {
    position: relative;
    display: inline-block;
    color: yellowgreen;
    font-size: clamp(40px, 8vw, 100px);
    animation: truckRide 5s ease-in-out infinite;

    text-shadow:
        0 0 4px rgba(246, 232, 95, 0.3);
}

@keyframes truckRide {

    0% {
        transform: translateY(0) rotate(0deg);
        text-shadow:
            0 0 4px rgba(246, 232, 95, 0.3);
    }

    10% {
        transform: translateY(-1px) rotate(-0.15deg);
        text-shadow:
            3px 0 4px rgba(246, 232, 95, 0.18),
            6px 0 10px rgba(246, 232, 95, 0.12);
    }

    20% {
        transform: translateY(1px) rotate(0.2deg);
        text-shadow:
            6px 0 5px rgba(246, 232, 95, 0.25),
            12px 0 16px rgba(246, 232, 95, 0.15);
    }

    30% {
        transform: translateY(-1px) rotate(-0.2deg);
        text-shadow:
            10px 0 6px rgba(246, 232, 95, 0.3),
            20px 0 18px rgba(246, 232, 95, 0.2),
            35px 0 30px rgba(246, 232, 95, 0.1);
    }

    35% {
        transform: translateY(-4px) rotate(-0.7deg);
    }

    37% {
        transform: translateY(3px) rotate(0.6deg);
    }

    50% {
        transform: translateY(0) rotate(0deg);
        text-shadow:
            14px 0 8px rgba(246, 232, 95, 0.35),
            28px 0 22px rgba(246, 232, 95, 0.2),
            45px 0 35px rgba(246, 232, 95, 0.1);
    }

    60% {
        transform: translateY(-3px) rotate(-0.5deg);
    }

    62% {
        transform: translateY(3px) rotate(0.5deg);
    }

    75% {
        transform: translateY(0) rotate(0deg);
    }

    88% {
        transform: translateY(-1px) rotate(-0.15deg);
    }

    100% {
        transform: translateY(0) rotate(0deg);
        text-shadow:
            0 0 4px rgba(246, 232, 95, 0.3);
    }
}


/* =========================
   DASHBOARD
========================= */

.headdy {
    background: #d3c2fa;
    color: black;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.dashboard-header h2 {
    margin: 0;
}

.add-user-btn {
    background: #658a00;
    color: white;
}


/* =========================
   TABLE
========================= */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
    background-color: #EDF6F1;
    color: black;
}

th,
td {
    border: 1px solid #504d4d;
    padding: 9px;
    text-align: left;
}

th {
    background: #91bba9;
    color: #111814;
}

td {
    background: #e0f4ff;
    color: black;
}

.action-column {
    white-space: nowrap;
    text-decoration: none !important;
}

.inactive-row td {
    text-decoration: line-through;
    background-color: rgba(49, 48, 48, 0.938);
}

.inactive-row .action-column {
    text-decoration: none !important;
}

.status-active,
.status-inactive {
    font-weight: bold;
}


/* =========================
   BUTTONS
========================= */

button {
    position: relative;
    overflow: hidden;
    border: 0;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
}

button:disabled {
    cursor: not-allowed;
    opacity: .45;
}

.submit-btn {
    background: #658a00;
    color: white;
}

.ed-bt {
    background: #6eac4b;
    color: black;
}

.D-bt {
    background: #ad3a3a;
    color: rgb(36, 35, 35);
}

.v-bt {
    background: #a2ad3a;
    color: black;
}

.clear-btn {
    background: #ddd;
}


/* =========================
   PAGINATION
========================= */

.pagination {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}


/* =========================
   MESSAGE
========================= */

.message {
    margin: 10px 0;
    padding: 10px;
    border-radius: 6px;
    display: none;
}

.error {
    background: #ffe1e1;
    color: #000;
}

.success {
    background: #e1ffe7;
    color: #000;
}


/* =========================
   UPDATE / ADD MODAL
========================= */

.form-popup {
    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.70);

    justify-content: center;
    align-items: center;

    padding: 20px;

    z-index: 2000;
}

.form-popup-box {
    position: relative;

    background: #FFF7ED;
    color: black;

    width: 100%;
    max-width: 900px;

    max-height: 90vh;

    padding: 25px;

    border-radius: 10px;

    overflow-y: auto;

    box-shadow:
        0 10px 40px rgba(0,0,0,.5);
}


/* Close X */

.close-form {
    position: absolute;

    top: 10px;
    right: 10px;

    border: none;

    background: transparent;

    font-size: 22px;

    cursor: pointer;

    padding: 5px 10px;
}


/* =========================
   FORM
========================= */

.form-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 14px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;

    margin-bottom: 5px;

    font-weight: bold;
}

input,
textarea,
button {
    font: inherit;
}

input,
textarea {
    width: 100%;

    padding: 10px;

    border: 1px solid #000;

    border-radius: 6px;
}

.fie {
    background: #E0F2FE;
}

textarea {
    min-height: 80px;
    resize: vertical;
}


/* =========================
   PASSWORD
========================= */

.password-box {
    position: relative;
    width: 100%;
}

.password-box input {
    width: 100%;
    padding-right: 45px;
}

.password-box button {
    position: absolute;

    right: 1%;
    top: 40%;

    transform: translateY(-50%);

    border: none;

    background: none;

    cursor: pointer;
}

#passStatus,
#reenterStatus {
    white-space: pre-line;
    display: block;
    margin-top: 5px;
}

.available {
    color: green;
}

.unavailable {
    color: red;
}

.checking {
    color: #555;
}

#usernameStatus {
    display: block;
    margin-bottom: 5px;
}


/* =========================
   MODAL BUTTONS
========================= */

.form-buttons {
    margin-top: 15px;

    display: flex;

    justify-content: flex-end;

    gap: 10px;
}


/* =========================
   DIAMOND EFFECT
========================= */

.diamond-effect {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;
}

.form-popup-box > h2,
.form-popup-box > #message,
.form-popup-box > form {
    position: relative;
    z-index: 2;
}

.diamond {
    position: absolute;

    width: 40px;
    height: 40px;

    left: 50%;
    top: 50%;

    border: 3px solid #3f886360;

    transform:
        translate(-50%, -50%)
        rotate(45deg)
        scale(0);

    opacity: 0;
}

.diamond.run {
    animation:
        diamondForward
        3s linear infinite;
}

@keyframes diamondForward {

    0% {
        transform:
            translate(-50%, -50%)
            rotate(45deg)
            scale(0);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, -50%)
            rotate(45deg)
            scale(15);

        opacity: 0;
    }
}


/* =========================
   HISTORY POPUP
========================= */

.history-popup {
    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.55);

    justify-content: center;
    align-items: center;

    padding: 20px;

    z-index: 3000;
}

.history-popup-box {
    position: relative;

    background:
        radial-gradient(
            #A6D9F7,
            #ABC798,
            #b9ffb7f6,
            #023c40
        );

    width: 100%;
    max-width: 1200px;

    max-height: 90vh;

    padding: 25px;

    border-radius: 10px;

    overflow: auto;
}

.close-history {
    position: absolute;

    top: 10px;
    right: 10px;

    border: none;

    background: transparent;

    font-size: 22px;

    cursor: pointer;

    padding: 5px 10px;
}

.history-table {
    width: 100%;

    min-width: 1200px;

    border-collapse: collapse;

    margin-top: 20px;
}

.history-table th,
.history-table td {
    border: 2px solid #1a1919;

    padding: 8px;

    text-align: left;

    white-space: nowrap;
}

.history-table th {
    background: #023c40;
    color: white;
}

.log-create,
.log-update,
.log-delete {
    font-weight: bold;
}


/* =========================
   PARTICLES
========================= */

#particles {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: -1;
}


/* =========================
   REVEAL
========================= */

.reveal-left,
.reveal-right {
    opacity: 0;

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;
}

.reveal-left {
    transform: translateX(-100px);
}

.reveal-right {
    transform: translateX(100px);
}

.reveal-left.show,
.reveal-right.show {
    opacity: 1;

    transform: translateX(0);
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    body {
        padding: 10px;
    }

    .history-popup-box,
    .form-popup-box {
        padding: 15px;
    }

    .dashboard-header {
        align-items: flex-start;
        flex-direction: column;
    }

}

</style>

</head>

<script>
let curser = "nothing";
/* ==================================================
   SESSION CHECK
================================================== */

async function checkSession() {

    try {

        const response = await fetch(
            "auth.php?action=session&_=" + Date.now(),
            {
                credentials: "include",
                cache: "no-store"
            }
        );

        const data = await response.json();

        if (!data.logged_in) {

            window.location.replace("login.html");

            return false;
        }
        curser=data.username;
        return true;

    }
    catch (error) {

        console.error(
            "Session check failed:",
            error
        );

        window.location.replace("login.html");
        
        return false;
    }
}


/* ==================================================
   BASIC ELEMENTS
================================================== */

const formPopup =
    document.getElementById("formPopup");

const userForm =
    document.getElementById("userForm");

const submitButton =
    document.getElementById("submitBtn");

const addUserButton =
    document.getElementById("addUserBtn");

const closeFormButton =
    document.getElementById("closeForm");

const cancelFormButton =
    document.getElementById("cancelForm");

const password =
    document.getElementById("password");

const reenterPassword =
    document.getElementById("reenterPassword");

const reenterSection =
    document.getElementById("reenterSection");

const username =
    document.getElementById("username");

const usernameStatus =
    document.getElementById("usernameStatus");

const mobile =
    document.getElementById("mobileno");


/* ==================================================
   API
================================================== */

const API_URL =
    "http://localhost/apiss/project1/user.php";

const AUTH_URL =
    "http://localhost/apiss/project1/auth.php";


/* ==================================================
   STATE
================================================== */

let currentPage = 1;

const limit = 5;

let totalPages = 1;

let editingId = null;

let originalData = null;

let usernameValid = false;

let usernameTimer = null;

let usernameCheckVersion = 0;


/* ==================================================
   PASSWORD STATE
================================================== */

let passwordValid = false;

let passwordsMatch = false;

//  FOR SNO NUMBERS

let count=1;


/* ==================================================
   FORM MODE
================================================== */

function isUpdateMode() {

    return editingId !== null;

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(text, type) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display =
        "block";
}


function clearMessage() {

    const box =
        document.getElementById("message");

    box.style.display =
        "none";

    box.textContent =
        "";
}


/* ==================================================
   GET FORM DATA
================================================== */

function getFormData() {

    return {

        name:
            document.getElementById("name")
                .value.trim(),

        dob:
            document.getElementById("dob")
                .value,

        fathername:
            document.getElementById("fathername")
                .value.trim(),

        qualification:
            document.getElementById("qualification")
                .value.trim(),

        city:
            document.getElementById("city")
                .value.trim(),

        mobileno:
            document.getElementById("mobileno")
                .value.trim(),

        address:
            document.getElementById("address")
                .value.trim(),

        username:
            document.getElementById("username")
                .value.trim(),

        password:
            document.getElementById("password")
                .value

    };

}


/* ==================================================
   CHECK WHETHER DATA CHANGED
================================================== */

function hasDataChanged() {

    if (!isUpdateMode()) {

        return true;
    }

    const current =
        getFormData();

    return (

        current.name !== originalData.name ||

        current.dob !== originalData.dob ||

        current.fathername !== originalData.fathername ||

        current.qualification !== originalData.qualification ||

        current.city !== originalData.city ||

        current.mobileno !== originalData.mobileno ||

        current.address !== originalData.address ||

        current.username !== originalData.username ||

        current.password !== originalData.password
    );

}


/* ==================================================
   FORM VALIDITY
================================================== */

function updateSubmitButton() {

    if (!isUpdateMode()) {

        submitButton.disabled =
            !(
                userForm.checkValidity() &&
                usernameValid &&
                passwordValid &&
                passwordsMatch
            );

        return;
    }


    /*
       UPDATE MODE

       Password does not have to be changed.

       If password is unchanged,
       password validation is not required.

       If password is changed,
       it must be valid and confirmed.
    */

    const currentPassword =
        password.value;

    const passwordChanged =
        currentPassword !==
        originalData.password;


    let passwordOkay;


    if (!passwordChanged) {

        passwordOkay = true;

    }
    else {

        passwordOkay =
            passwordValid &&
            passwordsMatch;
    }


    submitButton.disabled =
        !(
            userForm.checkValidity() &&
            usernameValid &&
            passwordOkay &&
            hasDataChanged()
        );

}


/* ==================================================
   MOBILE
================================================== */

mobile.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);

        updateSubmitButton();

    }
);


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==================================================
   READ JSON
================================================== */

async function readJson(response) {

    const text =
        await response.text();

    let data;

    try {

        data =
            text
                ? JSON.parse(text)
                : {};

    }
    catch (error) {

        throw new Error(
            "Server returned invalid JSON. HTTP "
            + response.status
        );
    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            (
                "Request failed. HTTP "
                + response.status
            )
        );

    }

    return data;
}


/* ==================================================
   CHECK USERNAME
================================================== */

username.addEventListener(
    "input",
    function () {

        const value =
            this.value.trim();

        clearTimeout(usernameTimer);

        usernameValid = false;

        usernameCheckVersion++;

        updateSubmitButton();


        if (value === "") {

            usernameStatus.innerHTML =
                "<strong>Username</strong>";

            usernameStatus.className =
                "";

            return;
        }


        if (value.length < 3) {

            usernameStatus.innerHTML =
                "<strong>Username</strong> " +
                "Enter at least 3 characters";

            usernameStatus.className =
                "checking";

            return;
        }


        /*
           During UPDATE:
           if username is exactly the original
           username, it is automatically valid.
        */

        if (
            isUpdateMode() &&
            value === originalData.username
        ) {

            usernameValid = true;

            usernameStatus.innerHTML =
                "<strong>Username</strong> " +
                "✓ Current username";

            usernameStatus.className =
                "available";

            updateSubmitButton();

            return;
        }


        usernameStatus.innerHTML =
            "<strong>Username</strong> Checking...";

        usernameStatus.className =
            "checking";


        const version =
            usernameCheckVersion;


        usernameTimer =
            setTimeout(
                function () {

                    checkUsername(
                        value,
                        version
                    );

                },
                400
            );

    }
);


/* ==================================================
   BACKEND USERNAME CHECK
================================================== */

async function checkUsername(
    usernameValue,
    version
) {

    try {

        let url =
            AUTH_URL +
            "?action=check_username&username=" +
            encodeURIComponent(usernameValue);


        if (isUpdateMode()) {

            url +=
                "&exclude_id=" +
                encodeURIComponent(editingId);

        }


        const response =
            await fetch(url, {
                credentials: "include"
            });


        const data =
            await response.json();


        /*
           Ignore an old request.
        */

        if (
            version !==
            usernameCheckVersion
        ) {
            return;
        }


        /*
           Username changed while request
           was running.
        */

        if (
            username.value.trim() !==
            usernameValue
        ) {
            return;
        }


        if (data.available) {

            usernameValid = true;

            usernameStatus.innerHTML =
                "<strong>Username</strong> " +
                "✓ Username available";

            usernameStatus.className =
                "available";

        }
        else {

            usernameValid = false;

            usernameStatus.innerHTML =
                "<strong>Username</strong> " +
                "✗ Username already taken";

            usernameStatus.className =
                "unavailable";

        }


        updateSubmitButton();

    }
    catch (error) {

        console.error(error);

        usernameValid = false;

        usernameStatus.innerHTML =
            "<strong>Username</strong> " +
            "Unable to check username";

        usernameStatus.className =
            "unavailable";

        updateSubmitButton();
    }

}


/* ==================================================
   PASSWORD VALIDATION
================================================== */

function checkpass() {

    const value =
        password.value;

    const status =
        document.getElementById("passStatus");


    /*
       UPDATE MODE:
       If password is unchanged,
       don't show password requirements.
    */

    if (
        isUpdateMode() &&
        value === originalData.password
    ) {

        passwordValid = true;

        status.textContent = "";

        updateSubmitButton();

        return;
    }


    const hasLength =
        value.length >= 8;

    const hasUppercase =
        /[A-Z]/.test(value);

    const hasNumber =
        /[0-9]/.test(value);

    const hasSpecial =
        /[^A-Za-z0-9]/.test(value);


    passwordValid =
        hasLength &&
        hasUppercase &&
        hasNumber &&
        hasSpecial;


    status.textContent =
        (hasLength ? "✓" : "✗") +
        " At least 8 characters\n" +

        (hasUppercase ? "✓" : "✗") +
        " At least 1 UPPER CASE\n" +

        (hasNumber ? "✓" : "✗") +
        " At least 1 number\n" +

        (hasSpecial ? "✓" : "✗") +
        " At least 1 special character";


    if (passwordValid) {

        reenterSection.style.display =
            "block";

    }
    else {

        reenterSection.style.display =
            "none";

        passwordsMatch = false;

        reenterPassword.value = "";

        document.getElementById(
            "reenterStatus"
        ).textContent = "";

    }


    updateSubmitButton();

}

/* ==================================================
   REENTER PASSWORD
================================================== */

function checkPasswords() {

    const status =
        document.getElementById(
            "reenterStatus"
        );


    /*
       Existing unchanged password.
    */

    if (
        isUpdateMode() &&
        password.value ===
        originalData.password
    ) {

        passwordsMatch = true;

        status.textContent = "";

        updateSubmitButton();

        return;
    }


    if (!passwordValid) {

        passwordsMatch = false;

        status.textContent = "";

        updateSubmitButton();

        return;
    }


    if (
        reenterPassword.value === ""
    ) {

        passwordsMatch = false;

        status.textContent = "";

        updateSubmitButton();

        return;
    }


    passwordsMatch =
        password.value ===
        reenterPassword.value;


    if (passwordsMatch) {

        status.textContent =
            "✓ Passwords match";

        status.className =
            "available";

    }
    else {

        status.textContent =
            "✗ Passwords do not match";

        status.className =
            "unavailable";
    }


    updateSubmitButton();

}


reenterPassword.addEventListener(
    "input",
    function () {

        checkPasswords();

    }
);

/* ==================================================
   GET USERS
================================================== */

async function getUsers() {

    clearMessage();

    try {

        const response =
            await fetch(
                API_URL +
                "?page=" +
                currentPage +
                "&limit=" +
                limit,
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const data =
            await readJson(response);


        displayUsers(
        data.users || [],
        Number(data.total) || 0
    );


        totalPages =
            Math.max(
                1,
                Number(
                    data.totalPages
                ) || 1
            );


        document.getElementById(
            "pageInfo"
        ).textContent =
            "Page " +
            currentPage +
            " of " +
            totalPages;


        document.getElementById(
            "prevBtn"
        ).disabled =
            currentPage <= 1;


        document.getElementById(
            "nextBtn"
        ).disabled =
            currentPage >= totalPages;

    }
    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}

function displayUsers(users, total) {

    const body =
        document.getElementById("usersBody");

    const coun =
        document.getElementById("Dhere");

   

    body.innerHTML = "";

    coun.innerHTML =
        `<h2>Dashboard</h2>
         <p>No. of entries : ${total}</p>`;


    if (users.length === 0) {

        body.innerHTML = `
            <tr>
                <td colspan="10">
                    No users found.
                </td>
            </tr>
        `;

        return;
    }


    users.forEach(
        function (user, index) {

            const row =
                document.createElement("tr");

            const inactive =
                user.status === "inactive";

            if (inactive) {

                row.classList.add(
                    "inactive-row"
                );

            }

            row.innerHTML = `
                <td>
                    ${(currentPage - 1) * limit + index + 1}
                </td>

                <td>
                    ${escapeHtml(user.id)}
                </td>

                <td>
                    ${escapeHtml(user.name)}
                </td>

                <td>
                    ${escapeHtml(user.dob)}
                </td>

                <td>
                    ${escapeHtml(user.fathername)}
                </td>

                <td>
                    ${escapeHtml(user.qualification)}
                </td>

                <td>
                    ${escapeHtml(user.city)}
                </td>

                <td>
                    ${escapeHtml(user.mobileno)}
                </td>

                <td>
                    ${escapeHtml(user.address)}
                </td>

                <td class="${
                    inactive
                    ? "status-inactive"
                    : "status-active"
                }">

                    ${escapeHtml(user.status)}

                </td>

                <td class="action-column">
                    <button type="button" 
                            ${ inactive ? "disabled" : "" } 
                            onclick="updateUser( ${Number(user.id)} )"
                            title="Update"  
                            class="ed-bt" >
                                <i class="fa-solid fa-pen"></i>
                    </button>
                    <button type="button" 
                            ${ inactive ? "disabled" : "" }
                            onclick="timelog( ${Number(user.id)} )"
                            title="View History"
                            class="v-bt" >
                                <i class="fa-solid fa-eye"></i>
                    </button>
                    <button type="button"
                            onclick="toggleStatus( ${Number(user.id)} )"
                            title="Activate / Inactivate"
                            class="D-bt" >
                                <i class="fa-solid fa-trash"></i>
                    </button>

                </td>
            `;

            count+=1;

            body.appendChild(row);
        }
    );
}

================================================== */

async function updateUser(id) {

    try {

        const response =
            await fetch(
                API_URL +
                "?id=" +
                encodeURIComponent(id),
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const user =
            await readJson(response);


        editingId =
            Number(id);


        /*
           IMPORTANT:
           user.php returns password_hash,
           not password.
        */

        const existingPassword =
            user.password_hash || "";


        originalData = {

            name:
                user.name || "",

            dob:
                user.dob || "",

            fathername:
                user.fathername || "",

            qualification:
                user.qualification || "",

            city:
                user.city || "",

            mobileno:
                user.mobileno || "",

            address:
                user.address || "",

            username:
                user.username || "",

            password:
                existingPassword

        };


        /*
           Fill form.
        */

        document.getElementById(
            "name"
        ).value =
            originalData.name;


        document.getElementById(
            "dob"
        ).value =
            originalData.dob;


        document.getElementById(
            "fathername"
        ).value =
            originalData.fathername;


        document.getElementById(
            "qualification"
        ).value =
            originalData.qualification;


        document.getElementById(
            "city"
        ).value =
            originalData.city;


        document.getElementById(
            "mobileno"
        ).value =
            originalData.mobileno;


        document.getElementById(
            "address"
        ).value =
            originalData.address;


        document.getElementById(
            "username"
        ).value =
            originalData.username;


        document.getElementById(
            "password"
        ).value =
            originalData.password;


        document.getElementById(
            "reenterPassword"
        ).value =
            "";


        /*
           Update mode.
        */

        document.getElementById(
            "formTitle"
        ).textContent =
            "Update User #" + id;


        submitButton.textContent =
            "Update";


        /*
           Current username is automatically valid.
        */

        usernameValid = true;

        usernameStatus.innerHTML =
            "<strong>Username</strong> " +
            "✓ Current username";

        usernameStatus.className =
            "available";


        /*
           Existing password is valid.
        */

        passwordValid = true;

        passwordsMatch = true;


        document.getElementById(
            "passStatus"
        ).textContent = "";


        document.getElementById(
            "reenterStatus"
        ).textContent = "";


        reenterSection.style.display =
            "none";


        clearMessage();


        /*
           IMPORTANT:
           Update starts disabled because
           nothing has changed yet.
        */

        submitButton.disabled =
            true;


        formPopup.style.display =
            "flex";

    }
    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==================================================
   FORM SUBMIT
================================================== */

userForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        clearMessage();


        /*
           ==========================================
           CHECK EACH FIELD ONE BY ONE
           ==========================================
           
           If a required field is empty,
           automatically focus that field.
        */

        const requiredFields = [
            document.getElementById("name"),
            document.getElementById("dob"),
            document.getElementById("fathername"),
            document.getElementById("qualification"),
            document.getElementById("city"),
            document.getElementById("mobileno"),
            document.getElementById("address"),
            document.getElementById("username"),
            document.getElementById("password")
        ];


        for (
            const field of requiredFields
        ) {

            if (
                field.value.trim() === ""
            ) {

                field.focus();

                return;
            }

        }


        /*
           ==========================================
           MOBILE NUMBER
           ==========================================
           
           Must contain EXACTLY 10 digits.
           
           If not:
           - stop submission
           - focus mobile field
        */

        const mobileValue =
            mobile.value.trim();


        if (
            !/^[0-9]{10}$/.test(
                mobileValue
            )
        ) {

            mobile.focus();

            mobile.setSelectionRange(
                mobile.value.length,
                mobile.value.length
            );

            return;
        }


        /*
           ==========================================
           USERNAME
           ==========================================
        */

        if (!usernameValid) {

            showMessage(
                "Please enter an available username.",
                "error"
            );

            username.focus();

            return;
        }


        /*
           ==========================================
           UPDATE MODE
           ==========================================
        */

        if (isUpdateMode()) {

            const currentPassword =
                password.value;


            const passwordChanged =
                currentPassword !==
                originalData.password;


            if (passwordChanged) {

                if (!passwordValid) {

                    showMessage(
                        "Please enter a valid password.",
                        "error"
                    );

                    password.focus();

                    return;
                }


                if (!passwordsMatch) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    reenterPassword.focus();

                    return;
                }

            }


            if (!hasDataChanged()) {

                showMessage(
                    "No changes were made.",
                    "error"
                );

                return;
            }

        }


        /*
           ==========================================
           ADD MODE
           ==========================================
        */

        else {

            if (!passwordValid) {

                showMessage(
                    "Please enter a valid password.",
                    "error"
                );

                password.focus();

                return;
            }


            if (!passwordsMatch) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                reenterPassword.focus();

                return;
            }

        }


        const data =
            getFormData();


        submitButton.disabled =
            true;


        const oldText =
            submitButton.textContent;


        submitButton.textContent =
            isUpdateMode()
            ? "Updating..."
            : "Creating...";


        try {

            let response;


            /*
               CREATE
            */

            if (
                editingId === null
            ) {

                response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "include",

                            body:
                                JSON.stringify(data)
                        }
                    );

            }


            /*
               UPDATE
            */

            else {

                response =
                    await fetch(
                        API_URL +
                        "?id=" +
                        encodeURIComponent(
                            editingId
                        ),
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "include",

                            body:
                                JSON.stringify(data)
                        }
                    );

            }


            const result =
                await readJson(response);


            showMessage(
                editingId === null
                ? "User created successfully."
                : "User updated successfully.",
                "success"
            );


            /*
               Refresh dashboard.
            */

            await getUsers();


            /*
               Close popup after successful operation.
            */

            setTimeout(
                function () {

                    closeForm();

                },
                500
            );

        }
        catch (error) {

            showMessage(
                error.message,
                "error"
            );

            submitButton.disabled =
                false;

            submitButton.textContent =
                oldText;

        }

    }
);

/* ==================================================
   TOGGLE STATUS
================================================== */

async function toggleStatus(id) {

    const confirmed =
        confirm(
            "Change this user's active/inactive status?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                API_URL +
                "?id=" +
                encodeURIComponent(id),
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );


        const data =
            await readJson(response);


        showMessage(
            "Status changed to " +
            data.status +
            ".",
            "success"
        );


        getUsers();

    }
    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==================================================
   PAGINATION
================================================== */

function previousPage() {

    if (currentPage > 1) {

        currentPage--;

        getUsers();

    }

}


function nextPage() {

    if (
        currentPage <
        totalPages
    ) {

        currentPage++;

        getUsers();

    }

}


/* ==================================================
   HISTORY
================================================== */

async function timelog(id) {

    const popup =
        document.getElementById(
            "historyPopup"
        );

    const historyBody =
        document.getElementById(
            "historyBody"
        );

    const pd =
        document.getElementById("pd");


    historyBody.innerHTML = `

        <tr>

            <td colspan="11">
                Loading history...
            </td>

        </tr>

    `;


    pd.textContent =
        "user_ID: " + id;


    popup.style.display =
        "flex";


    try {

        const response =
            await fetch(
                API_URL +
                "?id=" +
                encodeURIComponent(id) +
                "&his=true",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const data =
            await readJson(response);


        const logs =
            data.history || [];


        historyBody.innerHTML =
            "";


        if (logs.length === 0) {

            historyBody.innerHTML = `

                <tr>

                    <td colspan="11">
                        No history found.
                    </td>

                </tr>

            `;

            return;
        }


        logs.forEach(
            function (log, index) {

                const row =
                    document.createElement("tr");


                let logClass = "";


                if (
                    log.action ===
                    "CREATE"
                ) {

                    logClass =
                        "log-create";

                }
                else if (
                    log.action ===
                    "UPDATE"
                ) {

                    logClass =
                        "log-update";

                }
                else if (
                    log.action ===
                    "DELETE"
                ) {

                    logClass =
                        "log-delete";

                }


                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td class="${logClass}">
                        ${escapeHtml(log.action)}
                    </td>

                    <td>
                        ${escapeHtml(log.times)}
                    </td>

                    <td>
                        ${escapeHtml(log.name)}
                    </td>

                    <td>
                        ${escapeHtml(log.dob)}
                    </td>

                    <td>
                        ${escapeHtml(log.fathername)}
                    </td>

                    <td>
                        ${escapeHtml(log.qualification)}
                    </td>

                    <td>
                        ${escapeHtml(log.city)}
                    </td>

                    <td>
                        ${escapeHtml(log.mobileno)}
                    </td>

                    <td>
                        ${escapeHtml(log.address)}
                    </td>

                    <td>
                        ${escapeHtml(log.status)}
                    </td>

                `;


                historyBody.appendChild(row);

            }
        );

    }
    catch (error) {

        historyBody.innerHTML = `

            <tr>

                <td colspan="11">

                    ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>

        `;

    }

}

                "historyPopup"
            ).style.display =
                "none";

        }

    }
);


/* ==================================================
   DIAMOND EFFECT
================================================== */

const diamonds =
    document.querySelectorAll(
        ".diamond"
    );


submitButton.addEventListener(
    "mouseenter",
    function () {

        diamonds.forEach(
            function (diamond) {

                diamond.classList.add(
                    "run"
                );

            }
        );

    }
);


submitButton.addEventListener(
    "mouseleave",
    function () {

        diamonds.forEach(
            function (diamond) {

                diamond.classList.remove(
                    "run"
                );

                diamond.style.animation =
                    "none";

                diamond.offsetHeight;

                diamond.style.animation =
                    "";

            }
        );

    }
);


/* ==================================================
   SCROLL REVEAL
================================================== */

const revealElements =
    document.querySelectorAll(
        ".reveal-left, .reveal-right"
    );


const observer =
    new IntersectionObserver(
        function (entries) {

            entries.forEach(
                function (entry) {

                    if (
                        entry.isIntersecting
                    ) {

                        entry.target.classList.add(
                            "show"
                        );

                    }

                }
            );

        },
        {
            threshold: 0.15
        }
    );


revealElements.forEach(
    function (element) {

        observer.observe(element);

    }
);


/* ==================================================
   PARTICLES
================================================== */

const canvas =
    document.getElementById(
        "particles"
    );

const ctx =
    canvas.getContext("2d");


let particles = [];


let mouse = {
    x: null,
    y: null
};


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    createParticles();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


window.addEventListener(
    "mousemove",
    function (event) {

        mouse.x =
            event.clientX;

        mouse.y =
            event.clientY;

    }
);


window.addEventListener(
    "mouseleave",
    function () {

        mouse.x = null;

        mouse.y = null;

    }
);


class Particle {

    constructor() {

        this.x =
            Math.random() *
            canvas.width;

        this.y =
            Math.random() *
            canvas.height;

        this.size =
            Math.random() * 2 + 1;

        this.speedX =
            (Math.random() - 0.5) * 0.5;

        this.speedY =
            (Math.random() - 0.5) * 0.5;

    }


    update() {

        this.x +=
            this.speedX;

        this.y +=
            this.speedY;


        if (this.x < 0) {

            this.x =
                canvas.width;

        }

        if (
            this.x >
            canvas.width
        ) {

            this.x = 0;

        }

        if (this.y < 0) {

            this.y =
                canvas.height;

        }

        if (
            this.y >
            canvas.height
        ) {

            this.y = 0;

        }


        if (
            mouse.x !== null
        ) {

            const dx =
                this.x -
                mouse.x;

            const dy =
                this.y -
                mouse.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const radius = 150;


            if (
                distance < radius &&
                distance > 0
            ) {

                const force =
                    (radius - distance) /
                    radius;


                this.x +=
                    (dx / distance) *
                    force *
                    2;

                this.y +=
                    (dy / distance) *
                    force *
                    2;

            }

        }

    }


    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "rgb(238, 247, 118)";


        ctx.shadowBlur = 8;

        ctx.shadowColor =
            "#8B5CF6";

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}


function createParticles() {

    particles = [];


    const amount =
        Math.floor(
            (
                canvas.width *
                canvas.height
            ) / 2000
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push(
            new Particle()
        );

    }

}


function connectParticles() {

    const maxDistance = 140;


    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < particles.length;
            j++
        ) {

            const dx =
                particles[i].x -
                particles[j].x;

            const dy =
                particles[i].y -
                particles[j].y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                maxDistance
            ) {

                const opacity =
                    (
                        1 -
                        distance /
                        maxDistance
                    ) * 0.4;


                ctx.beginPath();

                ctx.moveTo(
                    particles[i].x,
                    particles[i].y
                );

                ctx.lineTo(
                    particles[j].x,
                    particles[j].y
                );


                ctx.strokeStyle =
                    `rgba(
                        139,
                        92,
                        246,
                        ${opacity}
                    )`;

                ctx.lineWidth = 0.7;

                ctx.stroke();

            }

        }

    }

}


function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    for (
        const particle of particles
    ) {

        particle.update();

    }


    connectParticles();


    for (
        const particle of particles
    ) {

        particle.draw();

    }


    requestAnimationFrame(
        animate
    );

}


resizeCanvas();

animate();
