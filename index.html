.forview {

.breathing-text {

    color: yellowgreen;

    font-size: clamp(40px, 8vw, 100px);

    animation: truckRide 5s ease-in-out infinite;

    text-shadow:
        0 0 4px rgba(246, 232, 95, 0.3);
}


@keyframes truckRide {

    /* ---------------- START ---------------- */

    0% {
        transform: translateY(0) rotate(0deg);

        text-shadow:
            0 0 4px rgba(246, 232, 95, 0.3);
    }


    /* accelerating */

    10% {
        transform: translateY(-1px) rotate(-0.15deg);

        text-shadow:
            3px 0 4px rgba(246, 232, 95, 0.18),
            6px 0 10px rgba(246, 232, 95, 0.12);
    }


    20% {
        transform: translateY(1px) rotate(0.2deg);

        text-shadow:
            6px 0 5px rgba(246, 232, 95, 0.25),
            12px 0 16px rgba(246, 232, 95, 0.15);
    }


    /* ---------------- FAST ---------------- */

    30% {
        transform: translateY(-1px) rotate(-0.2deg);

        text-shadow:
            10px 0 6px rgba(246, 232, 95, 0.3),
            20px 0 18px rgba(246, 232, 95, 0.2),
            35px 0 30px rgba(246, 232, 95, 0.1);
    }


    /* ---------------- ROAD BUMP ---------------- */

    35% {
        transform: translateY(-4px) rotate(-0.7deg);

        text-shadow:
            12px 0 7px rgba(246, 232, 95, 0.35),
            24px 0 20px rgba(246, 232, 95, 0.2);
    }


    37% {
        transform: translateY(3px) rotate(0.6deg);

        text-shadow:
            8px 0 6px rgba(246, 232, 95, 0.3),
            18px 0 18px rgba(246, 232, 95, 0.15);
    }


    /* ---------------- SMOOTH HIGH SPEED ---------------- */

    50% {
        transform: translateY(0) rotate(0deg);

        text-shadow:
            14px 0 8px rgba(246, 232, 95, 0.35),
            28px 0 22px rgba(246, 232, 95, 0.2),
            45px 0 35px rgba(246, 232, 95, 0.1);
    }


    /* ---------------- SECOND BUMP ---------------- */

    60% {
        transform: translateY(-3px) rotate(-0.5deg);

        text-shadow:
            18px 0 9px rgba(246, 232, 95, 0.4),
            35px 0 25px rgba(246, 232, 95, 0.2);
    }


    62% {
        transform: translateY(3px) rotate(0.5deg);

        text-shadow:
            12px 0 7px rgba(246, 232, 95, 0.3),
            25px 0 20px rgba(246, 232, 95, 0.15);
    }


    /* ---------------- CRUISING ---------------- */

    75% {
        transform: translateY(0) rotate(0deg);

        text-shadow:
            8px 0 6px rgba(246, 232, 95, 0.3),
            18px 0 18px rgba(246, 232, 95, 0.15);
    }


    /* ---------------- SLOWING ---------------- */

    88% {
        transform: translateY(-1px) rotate(-0.15deg);

        text-shadow:
            4px 0 5px rgba(246, 232, 95, 0.2),
            8px 0 12px rgba(246, 232, 95, 0.1);
    }


    /* ---------------- STOP ---------------- */

    100% {
        transform: translateY(0) rotate(0deg);

        text-shadow:
            0 0 4px rgba(246, 232, 95, 0.3);
    }
}









/* =========================
   ADD USER CARD
   ========================= */
.card {
    position: relative;
    overflow: hidden;

    background: #FFF7ED;
    color: black;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);

    isolation: isolate;
}


/* =========================
   DIAMOND EFFECT
   ========================= */
.diamond-effect {
    position: absolute;
    inset: 0;

    overflow: hidden;
    pointer-events: none;

    z-index: 1;
}
.card > h1,
.card > #message,
.card > form {
    position: relative;
    z-index: 2;
}.diamond {
    position: absolute;

    width: 40px;
    height: 40px;

    left: 50%;
    top: 50%;

    border: 3px solid #3f886360;

    transform:
        translate(-50%, -50%)
        rotate(45deg)
        scale(0);

    opacity: 0;
}


/* This class will be added by JavaScript */

.diamond.run {
    animation: diamondForward 3s linear infinite;
}


.diamond:nth-child(1) {
    animation-delay: 0s;
}

.diamond:nth-child(2) {
    animation-delay: 0.6s;
}

.diamond:nth-child(3) {
    animation-delay: 1.2s;
}

.diamond:nth-child(4) {
    animation-delay: 1.8s;
}

.diamond:nth-child(5) {
    animation-delay: 2.4s;
}

.diamond:nth-child(6) {
    animation-delay: 3.0s;
}

.diamond:nth-child(7) {
    animation-delay: 3.6s;
}

.diamond:nth-child(8) {
    animation-delay: 4.2s;
}

.diamond:nth-child(9) {
    animation-delay: 4.8s;
}

.diamond:nth-child(10) {
    animation-delay: 5.4s;
}

@keyframes diamondForward {

    0% {
        transform:
            translate(-50%, -50%)
            rotate(45deg)
            scale(0);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, -50%)
            rotate(45deg)
            scale(15);

        opacity: 0;
    }
}
/* Keep card content above diamonds */

.card-content {
    position: relative;
    z-index: 2;
}

<script>

let originalUsername = "";
let originalPassword = "";

/* ==================================================
   BASIC ELEMENTS
================================================== */

const submitButton =
    document.getElementById("submitBtn");

const password =
    document.getElementById("password");

const reenterPassword =
    document.getElementById("reenterPassword");

const reenterSection =
    document.getElementById("reenterSection");

const username =
    document.getElementById("username");

const usernameStatus =
    document.getElementById("usernameStatus");


/* ==================================================
   DIAMOND EFFECT
================================================== */

const diamonds =
    document.querySelectorAll(".diamond");


submitButton.addEventListener(
    "mouseenter",
    function () {

        diamonds.forEach(
            function (diamond) {

                diamond.classList.add("run");

            }
        );

    }
);


submitButton.addEventListener(
    "mouseleave",
    function () {

        diamonds.forEach(
            function (diamond) {

                diamond.classList.remove("run");

                diamond.style.animation = "none";

                diamond.offsetHeight;

                diamond.style.animation = "";

            }
        );

    }
);


/* ==================================================
   SCROLL REVEAL
================================================== */

const revealElements =
    document.querySelectorAll(
        ".reveal-left, .reveal-right"
    );


const observer =
    new IntersectionObserver(
        function (entries) {

            entries.forEach(
                function (entry) {

                    if (entry.isIntersecting) {

                        entry.target.classList.add(
                            "show"
                        );

                    }

                }
            );

        },
        {
            threshold: 0.15
        }
    );


revealElements.forEach(
    function (element) {

        observer.observe(element);

    }
);


/* ==================================================
   PARTICLES
================================================== */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");


let particles = [];


let mouse = {
    x: null,
    y: null
};


/* ==================================================
   CANVAS
================================================== */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    createParticles();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==================================================
   MOUSE
================================================== */

window.addEventListener(
    "mousemove",
    function (event) {

        mouse.x =
            event.clientX;

        mouse.y =
            event.clientY;

    }
);


window.addEventListener(
    "mouseleave",
    function () {

        mouse.x = null;
        mouse.y = null;

    }
);


/* ==================================================
   PARTICLE
================================================== */

class Particle {

    constructor() {

        this.x =
            Math.random() *
            canvas.width;

        this.y =
            Math.random() *
            canvas.height;

        this.size =
            Math.random() * 2 + 1;

        this.speedX =
            (Math.random() - 0.5) * 0.5;

        this.speedY =
            (Math.random() - 0.5) * 0.5;

    }


    update() {

        this.x +=
            this.speedX;

        this.y +=
            this.speedY;


        if (this.x < 0) {

            this.x =
                canvas.width;

        }


        if (this.x > canvas.width) {

            this.x = 0;

        }


        if (this.y < 0) {

            this.y =
                canvas.height;

        }


        if (this.y > canvas.height) {

            this.y = 0;

        }


        if (mouse.x !== null) {

            const dx =
                this.x - mouse.x;

            const dy =
                this.y - mouse.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const radius = 150;


            if (
                distance < radius &&
                distance > 0
            ) {

                const force =
                    (radius - distance) /
                    radius;


                this.x +=
                    (dx / distance) *
                    force *
                    2;

                this.y +=
                    (dy / distance) *
                    force *
                    2;

            }

        }

    }


    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "rgb(238, 247, 118)";


        ctx.shadowBlur = 8;

        ctx.shadowColor =
            "#8B5CF6";

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}


/* ==================================================
   CREATE PARTICLES
================================================== */

function createParticles() {

    particles = [];


    const amount =
        Math.floor(
            (
                canvas.width *
                canvas.height
            ) / 2000
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push(
            new Particle()
        );

    }

}


/* ==================================================
   CONNECT PARTICLES
================================================== */

function connectParticles() {

    const maxDistance = 140;


    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < particles.length;
            j++
        ) {

            const dx =
                particles[i].x -
                particles[j].x;

            const dy =
                particles[i].y -
                particles[j].y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                maxDistance
            ) {

                const opacity =
                    (
                        1 -
                        distance / maxDistance
                    ) * 0.4;


                ctx.beginPath();

                ctx.moveTo(
                    particles[i].x,
                    particles[i].y
                );

                ctx.lineTo(
                    particles[j].x,
                    particles[j].y
                );


                ctx.strokeStyle =
                    `rgba(139, 92, 246, ${opacity})`;

                ctx.lineWidth = 0.7;

                ctx.stroke();

            }

        }

    }

}


/* ==================================================
   ANIMATION
================================================== */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    for (
        const particle of particles
    ) {

        particle.update();

    }


    connectParticles();


    for (
        const particle of particles
    ) {

        particle.draw();

    }


    requestAnimationFrame(
        animate
    );

}


resizeCanvas();

animate();

/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* ==================================================
   READ JSON
================================================== */

async function readJson(response) {

    const text =
        await response.text();


    let data;


    try {

        data =
            text
                ? JSON.parse(text)
                : {};

    }

    catch (error) {

        throw new Error(
            "Server returned invalid JSON. HTTP "
            + response.status
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            (
                "Request failed. HTTP "
                + response.status
            )
        );

    }


    return data;

}

/* ==================================================
   CHECK PASSWORD
================================================== */

function checkpass() {

    const value =
        password.value;


    const status =
        document.getElementById(
            "passStatus"
        );


    const hasLength =
        value.length >= 8;


    const hasUppercase =
        /[A-Z]/.test(value);


    const hasNumber =
        /[0-9]/.test(value);


    const hasSpecial =
        /[^A-Za-z0-9]/.test(value);


    passwordValid =
        hasLength &&
        hasUppercase &&
        hasNumber &&
        hasSpecial;


    /* -------------------------
       SHOW REQUIREMENTS
    ------------------------- */

    status.textContent =
        (hasLength ? "✓" : "✗") +
        " At least 8 characters\n" +

        (hasUppercase ? "✓" : "✗") +
        " At least 1 UPPER CASE\n" +

        (hasNumber ? "✓" : "✗") +
        " At least 1 number\n" +

        (hasSpecial ? "✓" : "✗") +
        " At least 1 special character";


    /* -------------------------
       PASSWORD VALID
    ------------------------- */

    if (passwordValid) {

        reenterSection.style.display =
            "block";

    }


    /* -------------------------
       PASSWORD INVALID
    ------------------------- */

    else {

        reenterSection.style.display =
            "none";


        passwordsMatch =
            false;


        reenterPassword.value =
            "";


        document.getElementById(
            "reenterStatus"
        ).textContent =
            "";

    }


    updateSubmitButton();

}

            );

            "pageInfo"
        ).textContent =

            + " of "

            "prevBtn"
        ).disabled =

            "nextBtn"
        ).disabled =
            currentPage >= totalPages;

            error.message,

        );

}

async function updateUser(id) {

    try {

        const response =
            await fetch(
                API_URL
                + "?id="
                + encodeURIComponent(id)
            );


        const user =
            await readJson(
                response
            );


        /*
           Fill user information.
        */

        document.getElementById(
            "name"
        ).value =
            user.name || "";


        document.getElementById(
            "dob"
        ).value =
            user.dob || "";


        document.getElementById(
            "fathername"
        ).value =
            user.fathername || "";


        document.getElementById(
            "qualification"
        ).value =
            user.qualification || "";


        document.getElementById(
            "city"
        ).value =
            user.city || "";


        document.getElementById(
            "mobileno"
        ).value =
            user.mobileno || "";


        document.getElementById(
            "address"
        ).value =
            user.address || "";


        document.getElementById(
            "username"
        ).value =
            user.username || "";


        /*
           Backend returns the password
           as "password".

           Do NOT use password_hash here.
        */

        document.getElementById(
            "password"
        ).value =
            user.password_hash || "";


        /*
           Store which user is being edited.
        */

        editingId =
            Number(id);


        /*
           Store the original username
           and password.

           These are used to detect
           whether the user actually
           changed them.
        */

        originalUsername =
            user.username || "";

        originalPassword =
            user.password || "";


        /*
           Change form into UPDATE mode.
        */

        document.getElementById(
            "formTitle"
        ).textContent =
            "Update User #" + id;


        document.getElementById(
            "submitBtn"
        ).textContent =
            "Update";


        /*
           Existing username is already valid.
        */

        usernameValid =
            true;


        /*
           Existing password is already valid.
        */

        passwordValid =
            true;


        /*
           Existing password is considered
           matching because the user has not
           changed it.
        */

        passwordsMatch =
            true;


        /*
           Password re-enter section is hidden
           until the password is changed.
        */

        reenterPassword.value =
            "";

        reenterSection.style.display =
            "none";


        /*
           Clear password validation messages.
        */

        document.getElementById(
            "passStatus"
        ).textContent =
            "";


        document.getElementById(
            "reenterStatus"
        ).textContent =
            "";


        /*
           Show current username as valid.
        */

        usernameStatus.innerHTML =
            "<strong>Username</strong> ✓ Current username";


        usernameStatus.className =
            "available";


        /*
           Enable UPDATE button.
        */

        updateSubmitButton();


        /*
           Scroll to form.
        */

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}

        */

            showMessage(

            showMessage(

            showMessage(
                "Passwords do not match.",

            );

        try {

            ) {

                response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    data
                                )
                        }
                    );

            }


            /* -------------------------
               UPDATE
            ------------------------- */

            else {

                response =
                    await fetch(

                        API_URL
                        + "?id="
                        + encodeURIComponent(
                            editingId
                        ),

                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    data
                                )
                        }

                    );

            }


            const result =
                await readJson(

                );


            showMessage(

                editingId === null

        confirm(

        return;

    }


    try {

        const response =
            await fetch(

                API_URL
                + "?id="
                + encodeURIComponent(id),

                {
                    method: "DELETE"
                }

            );


        const data =
            await readJson(
                response
            );


        showMessage(
            "Status changed to "
            + data.status
            + ".",
            "success"
        );


        getUsers();

    }


    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}

    }

}


function nextPage() {

    if (
        currentPage < totalPages
    ) {

        currentPage++;

        getUsers();

    }

}

getUsers();
