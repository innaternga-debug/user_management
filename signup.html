<script>

//designs|||||||||||||||||||||||||||||||||||||||||||


/* ==================================================
   SCROLL REVEAL
   ================================================== */

const revealElements =
    document.querySelectorAll(
        ".reveal-left, .reveal-right"
    );


const observer =
    new IntersectionObserver(
        function(entries) {

            entries.forEach(function(entry) {

                if (entry.isIntersecting) {

                    entry.target.classList.add("show");

                }

            });

        },
        {
            threshold: 0.15
        }
    );


revealElements.forEach(function(element) {

    observer.observe(element);

});

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

let mouse = {
    x: null,
    y: null
};


/* ==================================================
   CANVAS
   ================================================== */

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    createParticles();

}

window.addEventListener("resize", resizeCanvas);


/* ==================================================
   MOUSE
   ================================================== */

window.addEventListener("mousemove", function(event) {

    mouse.x = event.clientX;
    mouse.y = event.clientY;

});

window.addEventListener("mouseleave", function() {

    mouse.x = null;
    mouse.y = null;

});


/* ==================================================
   PARTICLE
   ================================================== */

class Particle {

    constructor() {

        this.x =
            Math.random() * canvas.width;

        this.y =
            Math.random() * canvas.height;


        this.size =
            Math.random() * 2 + 1;


        /*
           Random roaming speed
        */

        this.speedX =
            (Math.random() - 0.5) * 0.5;

        this.speedY =
            (Math.random() - 0.5) * 0.5;

    }


    update() {

        /*
           Keep moving
        */

        this.x += this.speedX;
        this.y += this.speedY;


        /*
           Wrap around screen
        */

        if (this.x < 0)
            this.x = canvas.width;

        if (this.x > canvas.width)
            this.x = 0;

        if (this.y < 0)
            this.y = canvas.height;

        if (this.y > canvas.height)
            this.y = 0;


        /*
           Mouse reaction
        */

        if (mouse.x !== null) {

            const dx =
                this.x - mouse.x;

            const dy =
                this.y - mouse.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const radius = 150;


            if (
                distance < radius &&
                distance > 0
            ) {

                const force =
                    (radius - distance) /
                    radius;


                this.x +=
                    (dx / distance) *
                    force *
                    2;

                this.y +=
                    (dy / distance) *
                    force *
                    2;

            }

        }

    }


    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        //dot color
        ctx.fillStyle =
            "rgb(0, 65, 9)";


        ctx.shadowBlur = 8;

        ctx.shadowColor =
            "#8B5CF6";

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}


/* ==================================================
   CREATE PARTICLES
   ================================================== */

function createParticles() {

    particles = [];


    const amount =
        Math.floor(
            (canvas.width * canvas.height) /
            2000
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push(
            new Particle()
        );

    }

}


/* ==================================================
   PURPLE CONNECTIONS
   ================================================== */

function connectParticles() {

    const maxDistance = 140;


    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < particles.length;
            j++
        ) {

            const dx =
                particles[i].x -
                particles[j].x;

            const dy =
                particles[i].y -
                particles[j].y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
               Connect only nearby particles
            */

            if (distance < maxDistance) {

                /*
                   Closer = brighter
                */

                const opacity =
                    (1 - distance / maxDistance) *
                    0.4;


                ctx.beginPath();

                ctx.moveTo(
                    particles[i].x,
                    particles[i].y
                );

                ctx.lineTo(
                    particles[j].x,
                    particles[j].y
                );

                //line color
                ctx.strokeStyle =
                    `rgba(112, 1, 1, ${opacity})`;

                ctx.lineWidth = 0.7;

                ctx.stroke();

            }

        }

    }

}


/* ==================================================
   ANIMATION
   ================================================== */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Move particles
    */

    for (
        const particle of particles
    ) {

        particle.update();

    }


    /*
       Draw purple web
    */

    connectParticles();


    /*
       Draw particles
    */

    for (
        const particle of particles
    ) {

        particle.draw();

    }


    requestAnimationFrame(
        animate
    );

}


/* ==================================================
   START
   ================================================== */

resizeCanvas();

animate();











document.getElementById("userForm").addEventListener("submit", function(event) {
    event.preventDefault();
    login();
});

const api="http://localhost/apiss/project1/auth.php";
async function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch(api, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
                action: "login",
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (data.success) {
            console.log("Login successful");
            showMessage("redirecting","success");
            // Go to your protected page
            window.location.href = "index.html";

        } else {
            console.log(data.message);
            showMessage("error login","error");
        }

    } catch (error) {
        console.error("Login error:", error);
    }
}


document.getElementById("signup").addEventListener("click", function() {

    signup();

});



async function signup() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch(api, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
                action: "register",
                username: username,
                password: password
            })

        });

        const data = await response.json();

        if (data.success) {

            console.log("Signup successful");
            showMessage("Account created successfully", "success");

        } else {

            console.log(data.message);
            showMessage(data.message, "error");

        }

    } catch (error) {

        console.error("Signup error:", error);
        showMessage("Something went wrong", "error");

    }
}

















/* ==================================================
   MESSAGE
   ================================================== */

function showMessage(text, type) {

    const box =
        document.getElementById("message");

    box.innerHTML =
    text +
    " <a href='login.html' " +
    "style='color: rgb(247, 227, 227); text-decoration: none;' " +
    "onmouseover=\"this.style.color='rgb(220, 200, 200)'\" " +
    "onmouseout=\"this.style.color='white'\">" +
    "....login?</a>";

    box.className =
        "message " + type;

    box.style.display =
        "block";

    box.style.backgroundColor =
        "#1a1a1a";

    box.style.color =
        "#ffffff";

    box.style.padding =
        "12px 16px";

    box.style.borderRadius =
        "8px";

    box.style.border =
        "1px solid #444";

    box.style.textAlign =
        "center";

    box.style.fontSize =
        "14px";
}



function clearMessage() {

    const box =
        document.getElementById("message");

    box.style.display =
        "none";

    box.textContent =
        "";
}


/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}



/* ==================================================
   READ JSON
   ================================================== */

async function readJson(response) {

    const text =
        await response.text();


    let data;


    try {

        data =
            text
                ? JSON.parse(text)
                : {};

    }

    catch (error) {
        throw new Error(
            "Server returned invalid JSON. HTTP "
            + response.status
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            ("Request failed. HTTP "
            + response.status)
        );

    }


    return data;
}







/* ==================================================
   CLEAR FORM
   ================================================== */

function clearForm() {

    document.getElementById(
        "userForm"
    ).reset();


    editingId =
        null;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add User";


    document.getElementById(
        "submitBtn"
    ).textContent =
        "Submit";

}
