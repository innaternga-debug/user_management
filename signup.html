<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<title>Sign Up</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    background: black;
    color: #f7f0f8;
}

.container {
    max-width: 900px;
    margin: auto;
    position: relative;
    z-index: 2;
}

.signup-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.form-box {
    width: 100%;
    max-width: 900px;
    background: #FFF7ED;
    color: black;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.form-box h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

input, textarea, button {
    font: inherit;
}

input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #000;
    border-radius: 6px;
}

.fie {
    background: #E0F2FE;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

.password-box {
    position: relative;
    width: 100%;
}

.password-box input {
    padding-right: 45px;
}

.password-box button {
    position: absolute;
    right: 1%;
    top: 40%;
    transform: translateY(-50%);
    border: none;
    background: none;
    cursor: pointer;
    padding: 5px;
}

#passStatus,
#reenterStatus {
    white-space: pre-line;
    display: block;
    margin-top: 5px;
}

.available { color: green; }
.unavailable { color: red; }
.checking { color: #555; }

#usernameStatus {
    display: block;
    margin-bottom: 5px;
}

.form-buttons {
    margin-top: 15px;
    display: flex;
    justify-content: flex-end;
}

button {
    border: 0;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: .45;
}

.submit-btn {
    background: #658a00;
    color: white;
}

.message {
    margin: 10px 0;
    padding: 10px;
    border-radius: 6px;
    display: none;
}

.error {
    background: #ffe1e1;
    color: #000;
}

.success {
    background: #e1ffe7;
    color: #000;
}

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

@media (max-width: 700px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    body {
        padding: 10px;
    }

    .form-box {
        padding: 15px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">
<div class="signup-page">

<div class="form-box">

<h2>Create Account</h2>

<div id="message" class="message"></div>

<form id="userForm">

<div class="form-grid">

<div>
<label for="name">Name*</label>
<input class="fie" id="name" type="text" required autocomplete="off">
</div>

<div>
<label for="dob">DOB*</label>
<input class="fie" id="dob" type="date" required>
</div>

<div>
<label for="fathername">Father Name*</label>
<input class="fie" id="fathername" type="text" required autocomplete="off">
</div>

<div>
<label for="qualification">Qualification*</label>
<input class="fie" id="qualification" type="text" required autocomplete="off">
</div>

<div>
<label for="city">City*</label>
<input class="fie" id="city" type="text" required autocomplete="off">
</div>

<div>
<label for="mobileno">Mobile No*</label>
<input
    class="fie"
    id="mobileno"
    type="text"
    maxlength="10"
    minlength="10"
    pattern="[0-9]{10}"
    inputmode="numeric"
    placeholder="Enter 10 digit mobile number"
    required
    autocomplete="off"
>
</div>

<div class="full">
<label for="address">Address*</label>
<textarea class="fie" id="address" required></textarea>
</div>

<div>
<label for="username" id="usernameStatus">Username*</label>
<input
    class="fie"
    type="text"
    id="username"
    placeholder="Enter username"
    minlength="3"
    required
    autocomplete="off"
>
</div>

<div class="password-box">
<label for="password">Password*</label>
<input
    id="password"
    type="password"
    placeholder="Enter password"
    required
    autocomplete="off"
>
<button type="button" id="togglePassword">👁</button>
<span id="passStatus"></span>
</div>

<div class="password-box" id="reenterSection">
<label for="reenterPassword">Re-enter Password*</label>
<input
    type="password"
    id="reenterPassword"
    placeholder="Re-enter password"
    required
    autocomplete="off"
>
<button type="button" id="retogglePassword">👁</button>
<span id="reenterStatus"></span>
</div>

</div>

<div class="form-buttons">
<button class="submit-btn" type="submit" id="submitBtn" disabled>
Submit
</button>
</div>

</form>

</div>
</div>
</div>

<script>
const API_URL = "http://localhost/apiss/project1/user.php";
const AUTH_URL = "http://localhost/apiss/project1/auth.php";

const userForm = document.getElementById("userForm");
const submitButton = document.getElementById("submitBtn");

const password = document.getElementById("password");
const reenterPassword = document.getElementById("reenterPassword");
const reenterSection = document.getElementById("reenterSection");

const username = document.getElementById("username");
const usernameStatus = document.getElementById("usernameStatus");
const mobile = document.getElementById("mobileno");

let usernameValid = false;
let passwordValid = false;
let passwordsMatch = false;

let usernameTimer = null;
let usernameCheckVersion = 0;

function showMessage(text, type) {
    const box = document.getElementById("message");

    box.textContent = text;
    box.className = "message " + type;
    box.style.display = "block";
}

function clearMessage() {
    const box = document.getElementById("message");

    box.style.display = "none";
    box.textContent = "";
}

function getFormData() {
    return {
        name: document.getElementById("name").value.trim(),
        dob: document.getElementById("dob").value,
        fathername: document.getElementById("fathername").value.trim(),
        qualification: document.getElementById("qualification").value.trim(),
        city: document.getElementById("city").value.trim(),
        mobileno: mobile.value.trim(),
        address: document.getElementById("address").value.trim(),
        username: username.value.trim(),
        password: password.value
    };
}

async function readJson(response) {
    const text = await response.text();

    let data = {};

    try {
        data = text ? JSON.parse(text) : {};
    }
    catch (error) {
        throw new Error(
            "Server returned invalid JSON. HTTP " + response.status
        );
    }

    if (!response.ok) {
        throw new Error(
            data.error ||
            data.message ||
            ("Request failed. HTTP " + response.status)
        );
    }

    return data;
}

/* MOBILE: digits only, maximum 10 */
mobile.addEventListener("input", function () {
    this.value = this.value
        .replace(/\D/g, "")
        .slice(0, 10);

    updateSubmitButton();
});

/* USERNAME CHECK */
username.addEventListener("input", function () {

    const value = this.value.trim();

    clearTimeout(usernameTimer);

    usernameValid = false;
    usernameCheckVersion++;

    updateSubmitButton();

    if (value === "") {
        usernameStatus.innerHTML = "<strong>Username</strong>";
        usernameStatus.className = "";
        return;
    }

    if (value.length < 3) {
        usernameStatus.innerHTML =
            "<strong>Username</strong> Enter at least 3 characters";

        usernameStatus.className = "checking";
        return;
    }

    usernameStatus.innerHTML =
        "<strong>Username</strong> Checking...";

    usernameStatus.className = "checking";

    const version = usernameCheckVersion;

    usernameTimer = setTimeout(function () {
        checkUsername(value, version);
    }, 400);
});

async function checkUsername(usernameValue, version) {

    try {

        const url =
            AUTH_URL +
            "?action=check_username&username=" +
            encodeURIComponent(usernameValue);

        const response = await fetch(url, {
            credentials: "include",
            cache: "no-store"
        });

        const data = await readJson(response);

        if (version !== usernameCheckVersion) {
            return;
        }

        if (username.value.trim() !== usernameValue) {
            return;
        }

        if (data.available) {

            usernameValid = true;

            usernameStatus.innerHTML =
                "<strong>Username</strong> ✓ Username available";

            usernameStatus.className = "available";

        }
        else {

            usernameValid = false;

            usernameStatus.innerHTML =
                "<strong>Username</strong> ✗ Username already taken";

            usernameStatus.className = "unavailable";
        }

        updateSubmitButton();

    }
    catch (error) {

        usernameValid = false;

        usernameStatus.innerHTML =
            "<strong>Username</strong> Unable to check username";

        usernameStatus.className = "unavailable";

        updateSubmitButton();
    }
}

/* PASSWORD VALIDATION */
function checkpass() {

    const value = password.value;
    const status = document.getElementById("passStatus");

    const hasLength = value.length >= 8;
    const hasUppercase = /[A-Z]/.test(value);
    const hasNumber = /[0-9]/.test(value);
    const hasSpecial = /[^A-Za-z0-9]/.test(value);

    passwordValid =
        hasLength &&
        hasUppercase &&
        hasNumber &&
        hasSpecial;

    status.textContent =
        (hasLength ? "✓" : "✗") +
        " At least 8 characters\n" +

        (hasUppercase ? "✓" : "✗") +
        " At least 1 UPPER CASE\n" +

        (hasNumber ? "✓" : "✗") +
        " At least 1 number\n" +

        (hasSpecial ? "✓" : "✗") +
        " At least 1 special character";

    if (passwordValid) {
        reenterSection.style.display = "block";
    }
    else {
        reenterSection.style.display = "none";

        passwordsMatch = false;

        reenterPassword.value = "";

        document.getElementById("reenterStatus").textContent = "";
    }

    updateSubmitButton();
}

/* PASSWORD MATCH */
function checkPasswords() {

    const status =
        document.getElementById("reenterStatus");

    if (!passwordValid) {
        passwordsMatch = false;
        status.textContent = "";
        updateSubmitButton();
        return;
    }

    if (reenterPassword.value === "") {
        passwordsMatch = false;
        status.textContent = "";
        updateSubmitButton();
        return;
    }

    passwordsMatch =
        password.value === reenterPassword.value;

    if (passwordsMatch) {

        status.textContent =
            "✓ Passwords match";

        status.className =
            "available";

    }
    else {

        status.textContent =
            "✗ Passwords do not match";

        status.className =
            "unavailable";
    }

    updateSubmitButton();
}

password.addEventListener("input", function () {
    checkpass();
    checkPasswords();
});

reenterPassword.addEventListener("input", function () {
    checkPasswords();
});

/* OTHER FIELDS */
[
    "name",
    "dob",
    "fathername",
    "qualification",
    "city",
    "address"
].forEach(function (id) {

    const field = document.getElementById(id);

    field.addEventListener("input", updateSubmitButton);
    field.addEventListener("change", updateSubmitButton);
});

/* BUTTON ENABLE/DISABLE */
function updateSubmitButton() {

    submitButton.disabled = !(
        userForm.checkValidity() &&
        usernameValid &&
        passwordValid &&
        passwordsMatch
    );
}

/* SUBMIT */
userForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    clearMessage();

    /*
       Check every required field in order.
       First incomplete field gets focus.
    */
    const requiredFields = [
        document.getElementById("name"),
        document.getElementById("dob"),
        document.getElementById("fathername"),
        document.getElementById("qualification"),
        document.getElementById("city"),
        document.getElementById("mobileno"),
        document.getElementById("address"),
        document.getElementById("username"),
        document.getElementById("password"),
        document.getElementById("reenterPassword")
    ];

    for (const field of requiredFields) {

        if (field.value.trim() === "") {
            field.focus();
            return;
        }
    }

    /* Mobile must be exactly 10 digits */
    if (!/^[0-9]{10}$/.test(mobile.value.trim())) {

        mobile.focus();

        mobile.setSelectionRange(
            mobile.value.length,
            mobile.value.length
        );

        return;
    }

    /* Username */
    if (!usernameValid) {

        showMessage(
            "Please enter an available username.",
            "error"
        );

        username.focus();

        return;
    }

    /* Password */
    if (!passwordValid) {

        showMessage(
            "Please enter a valid password.",
            "error"
        );

        password.focus();

        return;
    }

    /* Password confirmation */
    if (!passwordsMatch) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        reenterPassword.focus();

        return;
    }

    const data = getFormData();

    submitButton.disabled = true;

    const oldText = submitButton.textContent;

    submitButton.textContent = "Creating...";

    try {

        const response = await fetch(API_URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify(data)
        });

        await readJson(response);

        showMessage(
            "Account created successfully. Redirecting to login...",
            "success"
        );

        setTimeout(function () {
            window.location.href = "login.html";
        }, 1500);

    }
    catch (error) {

        showMessage(
            error.message,
            "error"
        );

        submitButton.disabled = false;
        submitButton.textContent = oldText;
    }
});

/* PASSWORD VISIBILITY */
document.getElementById("togglePassword")
.addEventListener("click", function () {

    if (password.type === "password") {
        password.type = "text";
        this.textContent = "🙈";
    }
    else {
        password.type = "password";
        this.textContent = "👁";
    }
});

document.getElementById("retogglePassword")
.addEventListener("click", function () {

    if (reenterPassword.type === "password") {
        reenterPassword.type = "text";
        this.textContent = "🙈";
    }
    else {
        reenterPassword.type = "password";
        this.textContent = "👁";
    }
});

/* PARTICLES */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

let mouse = {
    x: null,
    y: null
};

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    createParticles();
}

window.addEventListener("resize", resizeCanvas);

window.addEventListener("mousemove", function (event) {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
});

window.addEventListener("mouseleave", function () {
    mouse.x = null;
    mouse.y = null;
});

class Particle {

    constructor() {

        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;

        this.size = Math.random() * 2 + 1;

        this.speedX =
            (Math.random() - 0.5) * 0.5;

        this.speedY =
            (Math.random() - 0.5) * 0.5;
    }

    update() {

        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;

        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;

        if (mouse.x !== null) {

            const dx = this.x - mouse.x;
            const dy = this.y - mouse.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            const radius = 150;

            if (distance < radius && distance > 0) {

                const force =
                    (radius - distance) / radius;

                this.x +=
                    (dx / distance) * force * 2;

                this.y +=
                    (dy / distance) * force * 2;
            }
        }
    }

    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgb(238, 247, 118)";

        ctx.shadowBlur = 8;
        ctx.shadowColor = "#8B5CF6";

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

function createParticles() {

    particles = [];

    const amount =
        Math.floor(
            (canvas.width * canvas.height) / 2000
        );

    for (let i = 0; i < amount; i++) {
        particles.push(new Particle());
    }
}

function connectParticles() {

    const maxDistance = 140;

    for (let i = 0; i < particles.length; i++) {

        for (let j = i + 1; j < particles.length; j++) {

            const dx =
                particles[i].x - particles[j].x;

            const dy =
                particles[i].y - particles[j].y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance < maxDistance) {

                const opacity =
                    (1 - distance / maxDistance) * 0.4;

                ctx.beginPath();

                ctx.moveTo(
                    particles[i].x,
                    particles[i].y
                );

                ctx.lineTo(
                    particles[j].x,
                    particles[j].y
                );

                ctx.strokeStyle =
                    `rgba(139, 92, 246, ${opacity})`;

                ctx.lineWidth = 0.7;

                ctx.stroke();
            }
        }
    }
}

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for (const particle of particles) {
        particle.update();
    }

    connectParticles();

    for (const particle of particles) {
        particle.draw();
    }

    requestAnimationFrame(animate);
}

resizeCanvas();
animate();

/* Focus first field when page opens */
window.addEventListener("load", function () {
    document.getElementById("name").focus();
});
</script>

</body>
</html>
